<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestañas</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <div class="contenedor">

        <div class="pestanas">
            <button class="boton-pestana activa" data-pestana="1">
                Primera pestaña 7️⃣
            </button>

            <button class="boton-pestana" data-pestana="2">
                Segunda pestaña 🐐
            </button>

            <button class="boton-pestana" data-pestana="3">
                Tercera pestaña 👑
            </button>

            <button class="boton-pestana" data-pestana="4">
                Cuarta pestaña ⚽
            </button>
        </div>

        <p class="descripcion">
            Haz clic en cada pestaña para ver su contenido.
        </p>

        <div class="contenido-pestanas">

            <div class="contenido activo" data-contenido="1">
                La primera.
            </div>

            <div class="contenido" data-contenido="2">
                La segunda.
            </div>

            <div class="contenido" data-contenido="3">
                La tercera.
            </div>

            <div class="contenido" data-contenido="4">
                La cuarta.
            </div>

        </div>

        <p class="texto-final">
            Cada pestaña tiene su propio contenido.
        </p>

    </div>

</body>

</html>
